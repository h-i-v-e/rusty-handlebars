name: Package VS Code extension

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*"

jobs:
  build-language-servers:
    uses: ./.github/workflows/build-language-servers.yml

  package:
    needs: build-language-servers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_target: darwin-arm64
            server_folder: darwin-arm64
            executable: rusty-handlebars-language-server
          - vscode_target: darwin-x64
            server_folder: darwin-x64
            executable: rusty-handlebars-language-server
          - vscode_target: linux-x64
            server_folder: linux-x64
            executable: rusty-handlebars-language-server
          - vscode_target: linux-arm64
            server_folder: linux-arm64
            executable: rusty-handlebars-language-server
          - vscode_target: win32-x64
            server_folder: win32-x64
            executable: rusty-handlebars-language-server.exe
          - vscode_target: win32-arm64
            server_folder: win32-arm64
            executable: rusty-handlebars-language-server.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rusty-handlebars-server-${{ matrix.server_folder }}
          path: native
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Build extension
        working-directory: editors/vscode
        run: npm run check && npm run compile
      - name: Stage server
        working-directory: editors/vscode
        run: >-
          node scripts/stage-server.mjs
          "../../native/server/${{ matrix.server_folder }}/${{ matrix.executable }}"
          "${{ matrix.server_folder }}"
      - name: Package platform VSIX
        working-directory: editors/vscode
        run: >-
          npx vsce package --no-dependencies
          --target ${{ matrix.vscode_target }}
          --out "rusty-handlebars-${{ matrix.vscode_target }}.vsix"
      - name: Inspect platform VSIX
        working-directory: editors/vscode
        shell: python {0}
        env:
          VSIX_PATH: rusty-handlebars-${{ matrix.vscode_target }}.vsix
          SERVER_PATH: server/${{ matrix.server_folder }}/${{ matrix.executable }}
        run: |
          import os
          import zipfile

          expected = f"extension/{os.environ['SERVER_PATH']}"
          with zipfile.ZipFile(os.environ["VSIX_PATH"]) as archive:
              server_files = [
                  name
                  for name in archive.namelist()
                  if name.startswith("extension/server/") and not name.endswith("/")
              ]
          if server_files != [expected]:
              raise SystemExit(
                  f"expected only {expected} in the VSIX, found {server_files}"
              )
      - uses: actions/upload-artifact@v4
        with:
          name: rusty-handlebars-${{ matrix.vscode_target }}
          path: editors/vscode/rusty-handlebars-${{ matrix.vscode_target }}.vsix
          if-no-files-found: error

  package-universal:
    needs: build-language-servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rusty-handlebars-server-*
          path: native
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Build extension
        working-directory: editors/vscode
        run: npm run check && npm run compile
      - name: Stage all servers
        working-directory: editors/vscode
        run: |
          node scripts/stage-server.mjs \
            "../../native/server/darwin-arm64/rusty-handlebars-language-server" \
            "darwin-arm64"
          node scripts/stage-server.mjs \
            "../../native/server/darwin-x64/rusty-handlebars-language-server" \
            "darwin-x64"
          node scripts/stage-server.mjs \
            "../../native/server/linux-arm64/rusty-handlebars-language-server" \
            "linux-arm64"
          node scripts/stage-server.mjs \
            "../../native/server/linux-x64/rusty-handlebars-language-server" \
            "linux-x64"
          node scripts/stage-server.mjs \
            "../../native/server/win32-arm64/rusty-handlebars-language-server.exe" \
            "win32-arm64"
          node scripts/stage-server.mjs \
            "../../native/server/win32-x64/rusty-handlebars-language-server.exe" \
            "win32-x64"
      - name: Package universal VSIX
        working-directory: editors/vscode
        run: >-
          npx vsce package --no-dependencies
          --out "rusty-handlebars-universal.vsix"
      - name: Inspect universal VSIX
        working-directory: editors/vscode
        shell: python {0}
        run: |
          import zipfile

          expected = sorted([
              "extension/server/darwin-arm64/rusty-handlebars-language-server",
              "extension/server/darwin-x64/rusty-handlebars-language-server",
              "extension/server/linux-arm64/rusty-handlebars-language-server",
              "extension/server/linux-x64/rusty-handlebars-language-server",
              "extension/server/win32-arm64/rusty-handlebars-language-server.exe",
              "extension/server/win32-x64/rusty-handlebars-language-server.exe",
          ])
          with zipfile.ZipFile("rusty-handlebars-universal.vsix") as archive:
              server_files = sorted([
                  name
                  for name in archive.namelist()
                  if name.startswith("extension/server/") and not name.endswith("/")
              ])
          if server_files != expected:
              raise SystemExit(
                  f"expected {expected} in the VSIX, found {server_files}"
              )
      - uses: actions/upload-artifact@v4
        with:
          name: rusty-handlebars-universal
          path: editors/vscode/rusty-handlebars-universal.vsix
          if-no-files-found: error
