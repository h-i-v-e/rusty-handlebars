name: Package VS Code extension

on:
  workflow_dispatch:
  push:
    tags:
      - "vscode-v*"

jobs:
  build-language-servers:
    uses: ./.github/workflows/build-language-servers.yml

  package:
    needs: build-language-servers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode_target: darwin-arm64
            server_folder: darwin-arm64
            executable: rusty-handlebars-language-server
          - vscode_target: darwin-x64
            server_folder: darwin-x64
            executable: rusty-handlebars-language-server
          - vscode_target: linux-x64
            server_folder: linux-x64
            executable: rusty-handlebars-language-server
          - vscode_target: linux-arm64
            server_folder: linux-arm64
            executable: rusty-handlebars-language-server
          - vscode_target: win32-x64
            server_folder: win32-x64
            executable: rusty-handlebars-language-server.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rusty-handlebars-server-${{ matrix.server_folder }}
          path: native
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Build extension
        working-directory: editors/vscode
        run: npm run check && npm run compile
      - name: Stage server
        working-directory: editors/vscode
        run: >-
          node scripts/stage-server.mjs
          "../../native/server/${{ matrix.server_folder }}/${{ matrix.executable }}"
          "${{ matrix.server_folder }}"
      - name: Package platform VSIX
        working-directory: editors/vscode
        run: >-
          npx vsce package --no-dependencies
          --target ${{ matrix.vscode_target }}
          --out "rusty-handlebars-${{ matrix.vscode_target }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: rusty-handlebars-${{ matrix.vscode_target }}
          path: editors/vscode/rusty-handlebars-${{ matrix.vscode_target }}.vsix
          if-no-files-found: error
