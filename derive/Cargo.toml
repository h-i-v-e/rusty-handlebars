[package]
name = "rusty-handlebars-derive"
version = "0.3.0"
edition = "2021"
description = "Procedural macro for compile-time rusty-handlebars templates"
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
minify-html = {workspace = true, optional = true}
proc-macro2 = "1.0.36"
quote = "1.0.15"
rusty-handlebars-parser = {path = "../parser", version = "0.3.0", default-features = false}
syn = {version = "3.0.3", features = ["full"]}
toml = "1.1.3"

[features]
minify-html = ["dep:minify-html", "rusty-handlebars-parser/minify-html"]
default = ["minify-html"]
